<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CostingPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CostingPlus · Part 1 · Login, Setup, Menu
   Design: kanakku ledger — indigo ink, ledger-red rule, turmeric
   ============================================================ */
:root {
  --ink: #1F2A6B;
  --ink-soft: #E8EAF6;
  --rule: #C62839;
  --turmeric: #E3A21A;
  --good: #17855A;
  --paper: #F6F7FA;
  --surface: #FFFFFF;
  --text: #1B1E2B;
  --muted: #5E6478;
  --line: #DADDE6;
  --shadow: 0 1px 2px rgba(31, 42, 107, .08), 0 6px 18px rgba(31, 42, 107, .06);
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --tabbar-h: 64px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #9AA6FF; --ink-soft: #232A4F; --rule: #FF5D6C; --turmeric: #F2B53A; --good: #3CC48A;
    --paper: #12141C; --surface: #1B1E29; --text: #ECEEF4; --muted: #9AA0B4; --line: #2C3040;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--text);
  font-family: 'Mukta Malar', 'Noto Sans Tamil', system-ui, sans-serif;
  font-size: 16px; line-height: 1.45; font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.hidden { display: none !important; }

/* ---------- Top bar with ledger double rule ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); padding: 12px 16px 10px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--rule); box-shadow: 0 3px 0 -2px var(--rule);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--surface); }
.topbar .brand { flex: 1; min-width: 0; }
.topbar .biz { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { font-size: 13px; color: var(--muted); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; color: var(--ink);
}
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- Main ---------- */
main { padding: 16px 16px calc(var(--tabbar-h) + 24px); max-width: 640px; margin: 0 auto; }
h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 6px; font-weight: 800; color: var(--ink); }
h2 { font-size: 19px; margin: 22px 0 10px; font-weight: 700; }
p.lead { color: var(--muted); margin: 0 0 18px; }

/* ---------- Bottom tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(var(--tabs, 5), 1fr);
}
.tabbar button {
  height: var(--tabbar-h); border: 0; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 600;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.4; }
.tabbar .plus span.dot {
  width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--surface);
  display: grid; place-items: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(31,42,107,.35);
}
.tabbar .plus svg { width: 26px; height: 26px; }

/* ---------- Ledger card ---------- */
.ledger {
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow);
  padding: 20px 20px 20px 30px; position: relative; overflow: hidden;
}
.ledger::before { content: ""; position: absolute; top: 0; bottom: 0; left: 16px; width: 2px; background: var(--rule); opacity: .55; }
.ledger::after { content: ""; position: absolute; top: 0; bottom: 0; left: 20px; width: 1px; background: var(--rule); opacity: .35; }

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
.input {
  width: 100%; height: 50px; padding: 0 14px; border-radius: var(--radius-md);
  border: 1.5px solid var(--line); background: var(--surface); font-size: 17px;
}
.input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--ink-soft); }
.input.error { border-color: var(--rule); }
.err-text { color: var(--rule); font-size: 14px; margin-top: 6px; }

.btn {
  height: 52px; padding: 0 22px; border-radius: var(--radius-md); border: 0;
  background: var(--ink); color: var(--surface); font-weight: 700; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.secondary { background: var(--ink-soft); color: var(--ink); }
.btn.danger { background: transparent; color: var(--rule); border: 1.5px solid var(--rule); }
.btn .spin { width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--ink-soft); border-radius: var(--radius-md); padding: 4px; }
.segment button { height: 42px; border: 0; border-radius: var(--radius-sm); background: none; font-weight: 600; color: var(--muted); }
.segment button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.switch-row { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.switch-row .txt { flex: 1; }
.switch-row .txt small { display: block; color: var(--muted); font-size: 13px; }
.switch { width: 52px; height: 30px; border-radius: 15px; background: var(--line); border: 0; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

/* ---------- Login ---------- */
.login-wrap { min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; justify-content: center; padding: 24px 18px; max-width: 420px; margin: 0 auto; }
.logo { display: flex; align-items: baseline; gap: 2px; margin-bottom: 4px; }
.logo .w { font-size: 34px; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
.logo .p { font-size: 34px; font-weight: 800; color: var(--turmeric); }
.tagline { color: var(--muted); margin: 0 0 26px; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 18px 0 8px; }
.pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
.pin-dots i.on { background: var(--ink); }
.pin-dots i.opt { border-style: dashed; opacity: .5; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 18px; }
.keypad button {
  height: 60px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface);
  font-size: 26px; font-weight: 600; color: var(--text);
}
.keypad button:active { background: var(--ink-soft); }
.keypad button.fn { font-size: 15px; color: var(--muted); }
.login-msg { text-align: center; min-height: 22px; color: var(--rule); font-size: 15px; }
.foot-help { text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
.foot-help a { color: var(--ink); font-weight: 600; }

/* ---------- Setup: industry picker ---------- */
.steps { display: flex; gap: 6px; margin: 4px 0 18px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--ink); }
.industries { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ind {
  text-align: left; padding: 14px; border-radius: var(--radius-md); border: 1.5px solid var(--line);
  background: var(--surface); min-height: 86px;
}
.ind b { display: block; font-size: 17px; }
.ind small { color: var(--muted); font-size: 13px; }
.ind[aria-pressed="true"] { border-color: var(--ink); background: var(--ink-soft); box-shadow: inset 4px 0 0 var(--ink); }
.row-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 22px; }

/* ---------- Entry tiles ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  border: 0; border-radius: var(--radius-lg); padding: 18px 16px; min-height: 120px; text-align: left; color: #fff;
  display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow);
}
.tile svg { width: 30px; height: 30px; }
.tile b { font-size: 18px; }
.tile small { display: block; opacity: .85; font-size: 13px; }
.t-expense { background: #D9480F; } .t-wages { background: #3B4CCA; } .t-prod { background: #0B7A75; }
.t-order { background: #7B2CBF; } .t-quote { background: #1C7ED6; } .t-advance { background: #A61E4D; }

/* ---------- Lists (settings) ---------- */
.list { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
.list button, .list a {
  width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; border: 0; background: none;
  text-align: left; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line);
}
.list > :last-child { border-bottom: 0; }
.list .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--ink-soft); color: var(--ink); flex: none; }
.list .ic svg { width: 20px; height: 20px; }
.list .tx { flex: 1; }
.list .tx small { display: block; color: var(--muted); font-size: 13px; }
.list .chev { color: var(--muted); }

.plan-strip { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--radius-md); background: var(--ink-soft); margin-bottom: 16px; }
.plan-strip b { color: var(--ink); }
.plan-strip svg { width: 28px; height: 28px; flex: none; color: var(--ink); }
.btn svg { width: 20px; height: 20px; }
#gst::placeholder { text-transform: none; }
.plan-strip.warn { background: #FFF3D6; }
@media (prefers-color-scheme: dark) { .plan-strip.warn { background: #3A2E10; } }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty svg { width: 54px; height: 54px; color: var(--line); margin-bottom: 10px; }

/* ---------- Toast + blocking loader ---------- */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; z-index: 50; padding: 14px 16px; border-radius: var(--radius-md);
  background: var(--text); color: var(--surface); font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  display: flex; gap: 12px; align-items: flex-start; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s;
}
.toast.show { transform: none; opacity: 1; pointer-events: auto; }
.toast.err { background: var(--rule); color: #fff; }
.toast.ok { background: var(--good); color: #fff; }
.toast a { color: inherit; font-weight: 700; white-space: nowrap; }
.loader { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 70%, transparent); }
.loader .spin { width: 38px; height: 38px; border: 4px solid var(--ink); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }

/* ============================================================
   PART 2 · Dashboard boxes + detail sheet
   ============================================================ */
.period { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--ink-soft); border-radius: var(--radius-md); padding: 4px; margin: 4px 0 6px; }
.period button { height: 38px; border: 0; border-radius: var(--radius-sm); background: none; font-weight: 600; font-size: 14px; color: var(--muted); }
.period button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.period-label { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.group-h { font-size: 15px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
.boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 560px) { .boxes { grid-template-columns: repeat(4, 1fr); } }
.box {
  --c: #1F2A6B; position: relative; border: 0; border-radius: var(--radius-lg); background: var(--c); color: #fff;
  padding: 14px 14px 12px; min-height: 108px; text-align: left; display: flex; flex-direction: column; gap: 2px;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--c) 35%, transparent);
}
.box .t { font-size: 13.5px; font-weight: 600; opacity: .92; }
.box .v { font-size: 24px; font-weight: 800; line-height: 1.15; margin-top: auto; word-break: break-word; }
.box .s { font-size: 12.5px; opacity: .9; }
.box.alert::after { content: ""; position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.8); } 50% { box-shadow: 0 0 0 6px rgba(255,255,255,0); } }
.box.skel { background: var(--line); box-shadow: none; animation: skel 1.2s ease-in-out infinite; }
@keyframes skel { 50% { opacity: .55; } }

.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(15, 18, 35, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--paper); width: 100%; max-width: 640px; max-height: 88vh; border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; animation: up .22s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px);
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
.sheet header h3 { flex: 1; margin: 0; font-size: 18px; }
.sheet .body { overflow-y: auto; padding: 14px 16px 18px; -webkit-overflow-scrolling: touch; }
.sheet footer { padding: 10px 16px 14px; border-top: 1px solid var(--line); }
.wa { background: #1DA851; }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.kpi { background: var(--surface); border-radius: var(--radius-md); padding: 10px 12px; box-shadow: var(--shadow); }
.kpi small { color: var(--muted); font-size: 12.5px; display: block; }
.kpi b { font-size: 18px; }
.pos { color: var(--good); } .neg { color: var(--rule); }

.stmt { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 4px 14px; margin-bottom: 14px; }
.stmt .r { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.stmt .r:last-child { border-bottom: 0; }
.stmt .r.sub { padding-left: 14px; color: var(--muted); font-size: 14.5px; }
.stmt .r.tot { font-weight: 800; border-bottom: 2px solid var(--rule); }
.stmt .r.tot.last { border-bottom: 0; border-top: 2px solid var(--rule); }

.rows { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
.row { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.row:last-child { border-bottom: 0; }
.row .l { flex: 1; min-width: 0; }
.row .l b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .l small { color: var(--muted); font-size: 13px; }
.row .rt { text-align: right; flex: none; }
.row .rt small { display: block; color: var(--muted); font-size: 12.5px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: var(--ink-soft); color: var(--ink); margin-left: 6px; vertical-align: 1px; }
.tag.red { background: color-mix(in srgb, var(--rule) 14%, transparent); color: var(--rule); }

.bars { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 14px; }
.bar { margin: 8px 0; }
.bar .top { display: flex; justify-content: space-between; font-size: 14.5px; }
.bar .track { height: 8px; background: var(--ink-soft); border-radius: 4px; margin-top: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--ink); border-radius: 4px; }
.chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 6px 2px 0; }
.chart .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.chart .c i { width: 100%; max-width: 28px; border-radius: 4px 4px 0 0; background: var(--ink); min-height: 2px; }
.chart .c i.neg { background: var(--rule); }
.chart .c span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.sec-h { font-size: 15px; font-weight: 700; margin: 6px 0 8px; }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>

<header class="topbar hidden" id="topbar">
  <div class="brand">
    <div class="biz" id="tbBiz">CostingPlus</div>
    <div class="sub" id="tbSub"></div>
  </div>
  <button class="icon-btn" id="helpBtn" aria-label="Watch how to use this screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>
  </button>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabbar hidden" id="tabbar" aria-label="Main menu"></nav>

<div class="toast" id="toast" role="status"></div>
<div class="loader hidden" id="loader"><div class="spin" aria-label="Loading"></div></div>

<script>
/* ============================================================
   CONFIG — change only these lines
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyRQlBtN7w2Ve2zpR-1s0uqHc1a_8XGPGttVcCZvseo4KGykTuFPPNK6VR9IokVmSLL/exec';
const APP_VERSION = '1.0-p2';
const SUPPORT_WHATSAPP = '';   // e.g. '919xxxxxxxxx' — shown as "Need help?" on login
// YouTube help links per screen (update when videos are recorded)
const HELP = {
  login: '', setup: '', home: '', entry: '', history: '', reports: '', settings: ''
};

/* ============================================================
   STATE + STORAGE
   ============================================================ */
const S = { token: null, user: null, business: null, cfg: null, route: 'home' };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('cp_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('cp_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('cp_' + k); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============================================================
   API — one place for every server call
   ============================================================ */
async function api(action, payload = {}, { silent = false } = {}) {
  const body = JSON.stringify(Object.assign({ action, token: S.token }, payload));
  let res;
  try {
    const r = await fetch(API_URL, { method: 'POST', body });   // text/plain → no CORS preflight
    res = await r.json();
  } catch (e) {
    res = { ok: false, code: 'NETWORK', error: navigator.onLine ? 'Server busy. Please try again in a moment.' : 'No internet. Check your connection and try again.' };
  }
  if (!res.ok && res.code === 'AUTH') { logout('Your session has expired. Please log in again.'); }
  else if (!res.ok && !silent) toast(res.error || 'Something went wrong.', 'err', helpLinkFor(S.route));
  return res;
}

/* ============================================================
   UI HELPERS
   ============================================================ */
let toastTimer;
function toast(msg, type = '', link = '') {
  const t = $('#toast');
  t.className = 'toast show ' + type;
  t.innerHTML = '<span style="flex:1">' + esc(msg) + '</span>' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">Watch how</a>' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), type === 'err' ? 6000 : 3000);
}
function loading(on) { $('#loader').classList.toggle('hidden', !on); }
function busy(btn, on, label) {
  if (!btn) return;
  btn.disabled = on;
  if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>' + (label || 'Please wait'); }
  else if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
}
function helpLinkFor(route) { return HELP[route] || ''; }
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = String(iso).split(/[-T]/); return d + '-' + m + '-' + y; }
function daysLeft(ddmmyyyy) {
  if (!ddmmyyyy) return null;
  const [d, m, y] = ddmmyyyy.split('-').map(Number);
  return Math.ceil((new Date(y, m - 1, d) - new Date(new Date().toDateString())) / 86400000);
}

/* ============================================================
   ROUTER
   ============================================================ */
const TABS_OWNER = [['home', 'Home'], ['entry', 'Entry'], ['history', 'History'], ['reports', 'Reports'], ['settings', 'Settings']];
const TABS_STAFF = [['home', 'Home'], ['entry', 'Entry'], ['history', 'History'], ['settings', 'More']];

function isOwner() { return S.user && S.user.role === 'Owner'; }

function buildTabbar() {
  const tabs = isOwner() ? TABS_OWNER : TABS_STAFF;
  const bar = $('#tabbar');
  bar.style.setProperty('--tabs', tabs.length);
  bar.innerHTML = tabs.map(([k, label]) => k === 'entry'
    ? '<button class="plus" data-go="entry" aria-label="New entry"><span class="dot">' + ICON.plus + '</span>' + label + '</button>'
    : '<button data-go="' + k + '">' + ICON[k] + label + '</button>').join('');
  bar.onclick = e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); };
}

function go(route) { if (location.hash !== '#' + route) location.hash = route; else render(); }

const ROUTES = ['home', 'entry', 'history', 'reports', 'settings', 'setup'];
function render() {
  if (!S.token) return renderLogin();
  if (!S.cfg) { loading(true); return; }
  loading(false);
  let r = (location.hash || '#home').slice(1);
  if (ROUTES.indexOf(r) === -1) r = 'home';
  if (r === 'reports' && !isOwner()) r = 'home';

  // First-time setup gate
  if (S.cfg && !S.cfg.setup.setupDone) {
    if (isOwner()) r = 'setup';
    else return renderWaitingSetup();
  }
  if (r === 'setup' && !isOwner()) r = 'home';

  S.route = r;
  $('#topbar').classList.remove('hidden');
  $('#tabbar').classList.toggle('hidden', r === 'setup' && !S.cfg.setup.setupDone);
  document.querySelectorAll('#tabbar [data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === r ? 'page' : 'false'));
  updateTopbar();
  window.scrollTo(0, 0);
  ({ home: renderHome, entry: renderEntry, history: renderHistory, reports: renderReports, settings: renderSettings, setup: renderSetup })[r]();
}
window.addEventListener('hashchange', () => { closeSheet(); render(); });

function updateTopbar() {
  const c = S.cfg;
  $('#tbBiz').textContent = (c && c.setup.businessName) || (S.business && S.business.name) || 'CostingPlus';
  $('#tbSub').textContent = S.user ? S.user.name + ' · ' + (isOwner() ? 'Owner' : 'Staff') : '';
  const link = helpLinkFor(S.route);
  $('#helpBtn').classList.toggle('hidden', !link);
  $('#helpBtn').onclick = () => window.open(link, '_blank', 'noopener');
}

/* ============================================================
   LOGIN
   ============================================================ */
function renderLogin(message) {
  $('#topbar').classList.add('hidden');
  $('#tabbar').classList.add('hidden');
  let pin = '';
  const savedPhone = store.get('phone') || '';
  view.innerHTML = `
    <div class="login-wrap">
      <div class="logo"><span class="w">Costing</span><span class="p">Plus</span></div>
      <p class="tagline">Know your real cost. Grow your profit.</p>
      <div class="ledger">
        <div class="field">
          <label for="phone">Mobile number</label>
          <input id="phone" class="input" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10"
                 placeholder="10-digit mobile" value="${esc(savedPhone)}">
        </div>
        <label style="font-weight:600">PIN</label>
        <div class="pin-dots" id="dots" aria-hidden="true"></div>
        <div class="login-msg" id="loginMsg">${esc(message || '')}</div>
        <div class="keypad" id="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}
          <button type="button" class="fn" data-k="clear">Clear</button>
          <button type="button" data-k="0">0</button>
          <button type="button" class="fn" data-k="back" aria-label="Delete last digit">⌫</button>
        </div>
        <button class="btn" id="loginBtn" disabled>Log in</button>
      </div>
      <div class="foot-help">
        Forgot PIN? Ask your owner${SUPPORT_WHATSAPP ? ` or <a href="https://wa.me/${SUPPORT_WHATSAPP}?text=${encodeURIComponent('Hi, I need help logging in to CostingPlus')}" target="_blank" rel="noopener">message support</a>` : ''}.
        ${HELP.login ? `<br><a href="${esc(HELP.login)}" target="_blank" rel="noopener">Watch how to log in</a>` : ''}
      </div>
    </div>`;

  const phoneEl = $('#phone'), btn = $('#loginBtn'), dots = $('#dots'), msg = $('#loginMsg');
  const draw = () => {
    dots.innerHTML = [0,1,2,3,4,5].map(i => `<i class="${i < pin.length ? 'on' : ''} ${i >= 4 && i >= pin.length ? 'opt' : ''}"></i>`).join('');
    btn.disabled = !(phoneEl.value.replace(/\D/g, '').length === 10 && pin.length >= 4);
  };
  draw();
  phoneEl.addEventListener('input', () => { phoneEl.value = phoneEl.value.replace(/\D/g, '').slice(0, 10); msg.textContent = ''; draw(); });
  $('#keypad').onclick = e => {
    const k = e.target.closest('[data-k]'); if (!k) return;
    const v = k.dataset.k;
    if (v === 'clear') pin = ''; else if (v === 'back') pin = pin.slice(0, -1); else if (pin.length < 6) pin += v;
    msg.textContent = ''; draw();
  };
  document.onkeydown = e => {
    if (S.token || document.activeElement === phoneEl) return;
    if (/^\d$/.test(e.key) && pin.length < 6) { pin += e.key; draw(); }
    if (e.key === 'Backspace') { pin = pin.slice(0, -1); draw(); }
    if (e.key === 'Enter' && !btn.disabled) btn.click();
  };

  btn.onclick = async () => {
    busy(btn, true, 'Logging in');
    const phone = phoneEl.value.replace(/\D/g, '');
    const r = await api('login', { phone, pin }, { silent: true });
    busy(btn, false);
    if (!r.ok) { msg.textContent = r.error; pin = ''; draw(); return; }
    document.onkeydown = null;
    S.token = r.data.token; S.user = r.data.user; S.business = r.data.business;
    store.set('token', S.token); store.set('user', S.user); store.set('business', S.business); store.set('phone', phone);
    await afterLogin();
  };
  if (!savedPhone) phoneEl.focus();
}

async function afterLogin() {
  buildTabbar();
  loading(true);
  const r = await api('getConfig');
  loading(false);
  if (!r.ok) return;
  S.cfg = r.data; store.set('cfg', S.cfg);
  if (!location.hash) location.hash = 'home'; else render();
}

function logout(message) {
  if (S.token) fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', token: S.token }) }).catch(() => {});
  S.token = S.user = S.business = S.cfg = null;
  ['token', 'user', 'business', 'cfg'].forEach(store.del);
  history.replaceState(null, '', location.pathname);
  renderLogin(message);
}

/* ============================================================
   SETUP (first run wizard + later edit)
   ============================================================ */
function renderSetup() {
  const c = S.cfg, s = c.setup, first = !s.setupDone;
  const d = { businessName: s.businessName, ownerName: s.ownerName, gstNo: s.gstNo, industry: s.industry,
              unit: s.unit, weekStart: s.weekStart || 'Mon', overheadToCost: s.overheadToCost };
  let step = 1;

  const draw = () => {
    const ind = c.industries.find(i => i.name === d.industry);
    view.innerHTML = `
      <h1>${first ? 'Set up your business' : 'Business setup'}</h1>
      <p class="lead">${first ? 'Three quick steps. You can change these later in Settings.' : 'Changes apply to new entries.'}</p>
      <div class="steps" aria-label="Step ${step} of 3">${[1,2,3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="ledger" id="stepBox">${[stepBusiness, stepIndustry, stepPrefs][step - 1](ind)}</div>
      <div class="row-btns">
        <button class="btn secondary" id="back" ${step === 1 ? (first ? 'style="visibility:hidden"' : '') : ''}>${step === 1 && !first ? 'Cancel' : 'Back'}</button>
        <button class="btn" id="next">${step < 3 ? 'Continue' : (first ? 'Finish setup' : 'Save changes')}</button>
      </div>`;
    bindStep();
  };

  const stepBusiness = () => `
    <h2 style="margin-top:0">Your business</h2>
    <div class="field"><label for="bn">Business name</label>
      <input id="bn" class="input" value="${esc(d.businessName)}" maxlength="80" placeholder="e.g. Sri Murugan Knits"></div>
    <div class="field"><label for="on">Owner name</label>
      <input id="on" class="input" value="${esc(d.ownerName)}" maxlength="60"></div>
    <div class="field"><label for="gst">GST number <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input id="gst" class="input" value="${esc(d.gstNo)}" maxlength="15" style="text-transform:uppercase" placeholder="15 characters">
      <div class="hint">With a GST number, GST on purchases is not counted as cost (you claim it back).</div></div>`;

  const stepIndustry = () => `
    <h2 style="margin-top:0">What do you make?</h2>
    <p class="lead" style="margin-bottom:12px">We'll load the right processes and expense heads for you.</p>
    <div class="industries" id="indList">
      ${c.industries.map(i => `<button type="button" class="ind" data-ind="${esc(i.name)}" aria-pressed="${i.name === d.industry}">
         <b>${esc(i.name)}</b><small>Tracks by ${esc(i.job.toLowerCase())} · ${esc(i.unit)}</small></button>`).join('')}
    </div>
    ${!first ? '<div class="hint" style="margin-top:12px">Industry can be changed only before any entries are added.</div>' : ''}`;

  const stepPrefs = ind => `
    <h2 style="margin-top:0">How you count</h2>
    <div class="field"><label for="unit">Counting unit</label>
      <input id="unit" class="input" value="${esc(d.unit || (ind && ind.unit) || '')}" maxlength="12" placeholder="${esc(ind ? ind.unit : 'Pcs')}">
      <div class="hint">Cost will show as "cost per ${esc(d.unit || (ind && ind.unit) || 'unit')}".</div></div>
    <div class="field"><label>Week starts on</label>
      <div class="segment" id="week">
        <button type="button" data-w="Mon" aria-pressed="${d.weekStart === 'Mon'}">Monday</button>
        <button type="button" data-w="Sun" aria-pressed="${d.weekStart === 'Sun'}">Sunday</button>
      </div><div class="hint">Used for weekly wages and weekly reports.</div></div>
    <div class="switch-row">
      <div class="txt"><b>Add overheads to order cost</b>
        <small>Rent, EB, salaries are shared across pieces, so you see the full cost per ${esc(d.unit || (ind && ind.unit) || 'unit')}.</small></div>
      <button type="button" class="switch" id="oh" role="switch" aria-checked="${!!d.overheadToCost}" aria-label="Add overheads to order cost"></button>
    </div>`;

  const collect = () => {
    if (step === 1) { d.businessName = $('#bn').value.trim(); d.ownerName = $('#on').value.trim(); d.gstNo = $('#gst').value.trim().toUpperCase(); }
    if (step === 3) { d.unit = $('#unit').value.trim(); }
  };
  const validate = () => {
    if (step === 1) {
      if (!d.businessName) return mark('#bn', 'Enter your business name.');
      if (d.gstNo && !/^[0-9A-Z]{15}$/.test(d.gstNo)) return mark('#gst', 'GST number must be 15 letters/numbers.');
    }
    if (step === 2 && !d.industry) { toast('Choose what you make.', 'err'); return false; }
    return true;
  };
  const mark = (sel, msg) => {
    const el = $(sel); el.classList.add('error'); el.focus();
    const old = el.parentNode.querySelector('.err-text'); if (old) old.remove();
    el.insertAdjacentHTML('afterend', `<div class="err-text">${esc(msg)}</div>`);
    return false;
  };

  const bindStep = () => {
    const list = $('#indList');
    if (list) list.onclick = e => {
      const b = e.target.closest('[data-ind]'); if (!b) return;
      if (d.industry !== b.dataset.ind) d.unit = '';
      d.industry = b.dataset.ind;
      list.querySelectorAll('[data-ind]').forEach(x => x.setAttribute('aria-pressed', x === b));
    };
    const wk = $('#week');
    if (wk) wk.onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; d.weekStart = b.dataset.w;
      wk.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    const oh = $('#oh');
    if (oh) oh.onclick = () => { d.overheadToCost = !d.overheadToCost; oh.setAttribute('aria-checked', d.overheadToCost); };

    $('#back').onclick = () => { if (step === 1) { if (!first) go('settings'); return; } collect(); step--; draw(); };
    $('#next').onclick = async e => {
      collect();
      if (!validate()) return;
      if (step < 3) { step++; draw(); return; }
      const btn = e.currentTarget;
      busy(btn, true, 'Saving');
      const r = await api('saveSetup', { data: d });
      busy(btn, false);
      if (!r.ok) return;
      S.cfg = r.data; store.set('cfg', S.cfg);
      toast(first ? 'Setup complete. You\'re ready to start.' : 'Setup saved.', 'ok');
      go('home');
    };
  };
  draw();
}

function renderWaitingSetup() {
  $('#topbar').classList.remove('hidden'); updateTopbar();
  $('#tabbar').classList.add('hidden');
  view.innerHTML = `<div class="empty">${ICON.building}<h2>Setup not finished</h2>
    <p>Your owner needs to complete the business setup first. Try again after that.</p>
    <button class="btn secondary" style="max-width:260px" onclick="refreshConfig()">Check again</button>
    <p><button class="btn danger" style="max-width:260px;margin-top:10px" onclick="logout()">Log out</button></p></div>`;
}
async function refreshConfig() { loading(true); const r = await api('getConfig'); loading(false); if (r.ok) { S.cfg = r.data; store.set('cfg', S.cfg); render(); } }

/* ============================================================
   HOME (dashboard arrives in Part 2)
   ============================================================ */
function renderHome() {
  const left = S.business ? daysLeft(S.business.expiry) : null;
  S.period = S.period || 'thisMonth';
  view.innerHTML = `
    ${planStrip(left)}
    <h1>Vanakkam, ${esc((S.user.name || '').split(' ')[0])}</h1>
    ${isOwner() ? `
      <div class="period" id="period" role="group" aria-label="Period">
        ${[['thisWeek','Week'],['thisMonth','Month'],['lastMonth','Last month'],['custom','Dates']]
          .map(([k, l]) => `<button data-p="${k}" aria-pressed="${S.period === k}">${l}</button>`).join('')}
      </div>
      <p class="period-label" id="periodLabel">&nbsp;</p>` : `<p class="lead">Tap + to add today's entries.</p>`}
    <div id="dash">${skeleton(isOwner() ? 12 : 3)}</div>`;
  if (isOwner()) $('#period').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    if (b.dataset.p === 'custom') return pickDates();
    S.period = b.dataset.p; S.from = S.to = null; renderHome();
  };
  loadDashboard();
}

function skeleton(n) { return `<div class="boxes">${Array.from({ length: n }, () => '<div class="box skel"></div>').join('')}</div>`; }
function periodPayload() { return { period: S.period, from: S.from, to: S.to }; }

const BOX_COLORS = { blue: '#1C64F2', green: '#15803D', orange: '#D9480F', red: '#C62839', darkgreen: '#166534', purple: '#7B2CBF',
                     yellow: '#A16207', teal: '#0F766E', indigo: '#3B4CCA', pink: '#BE185D', sky: '#0369A1', grey: '#475569' };
const GROUPS = [['Money', ['sales','gross','opex','net']], [null, ['running','loss','due','completed']], ['Cost control', ['labour','overhead','quotes','gst']]];

async function loadDashboard() {
  const r = await api('dashboard', periodPayload());
  const dash = $('#dash'); if (!dash || !r.ok) return;
  S.dash = r.data;
  if ($('#periodLabel')) $('#periodLabel').textContent = r.data.period ? r.data.period + (S.period === 'custom' ? '' : ' so far') : '';
  const boxHtml = b => `<button class="box ${b.alert ? 'alert' : ''}" style="--c:${BOX_COLORS[b.color] || '#1F2A6B'}" data-key="${b.key}" data-detail="${b.detail}">
      <span class="t">${esc(b.title)}</span><span class="v">${esc(b.value)}</span><span class="s">${esc(b.sub)}</span></button>`;
  if (r.data.staff) { dash.innerHTML = `<div class="boxes">${r.data.boxes.map(boxHtml).join('')}</div>`; }
  else {
    const byKey = {}; r.data.boxes.forEach(b => byKey[b.key] = b);
    GROUPS[1][0] = r.data.labels.jobs;
    dash.innerHTML = GROUPS.map(([h, keys]) => `<div class="group-h">${esc(h)}</div><div class="boxes">${keys.map(k => byKey[k] ? boxHtml(byKey[k]) : '').join('')}</div>`).join('');
  }
  dash.onclick = e => { const b = e.target.closest('[data-key]'); if (b) openDetail(b.dataset.key, b.dataset.detail); };
}

function pickDates() {
  const today = new Date().toISOString().slice(0, 10);
  openSheet('Choose dates', `
    <div class="dates">
      <div class="field"><label for="dFrom">From</label><input id="dFrom" type="date" class="input" max="${today}" value="${S.from || today.slice(0, 8) + '01'}"></div>
      <div class="field"><label for="dTo">To</label><input id="dTo" type="date" class="input" max="${today}" value="${S.to || today}"></div>
    </div>
    <button class="btn" id="dApply">Show report</button>`);
  $('#dApply').onclick = () => {
    const f = $('#dFrom').value, t = $('#dTo').value;
    if (!f || !t || f > t) return toast('Choose a valid date range.', 'err');
    S.period = 'custom'; S.from = f; S.to = t; closeSheet(); renderHome();
  };
}

/* ---------- Bottom sheet with back stack ---------- */
const SHEET = { stack: [] };
function openSheet(title, html, share, push) {
  if (!push) SHEET.stack = [];
  SHEET.stack.push({ title, html, share });
  drawSheet();
}
function drawSheet() {
  const top = SHEET.stack[SHEET.stack.length - 1];
  let bg = $('#sheetBg');
  if (!bg) {
    bg = document.createElement('div'); bg.id = 'sheetBg'; bg.className = 'sheet-bg';
    bg.onclick = e => { if (e.target === bg) closeSheet(); };
    document.body.appendChild(bg); document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', escClose);
  }
  bg.innerHTML = `<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(top.title)}">
    <header>
      ${SHEET.stack.length > 1 ? '<button class="icon-btn" id="sBack" aria-label="Back">‹</button>' : ''}
      <h3>${esc(top.title)}</h3>
      <button class="icon-btn" id="sClose" aria-label="Close">✕</button>
    </header>
    <div class="body">${top.html}</div>
    ${top.share ? `<footer><button class="btn wa" id="sShare">${ICON.chat} Share on WhatsApp</button></footer>` : ''}
  </section>`;
  $('#sClose').onclick = closeSheet;
  if ($('#sBack')) $('#sBack').onclick = () => { SHEET.stack.pop(); drawSheet(); };
  if ($('#sShare')) $('#sShare').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(top.share), '_blank', 'noopener');
  bg.querySelectorAll('[data-job]').forEach(el => el.onclick = () => openOrderCost(el.dataset.job));
}
function closeSheet() { const bg = $('#sheetBg'); if (bg) bg.remove(); document.body.style.overflow = ''; SHEET.stack = []; document.removeEventListener('keydown', escClose); }
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function sheetLoading(title) { openSheet(title, '<div style="display:grid;place-items:center;padding:40px"><div class="spin" style="width:32px;height:32px;border:4px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></div></div>'); }

/* ---------- Formatting ---------- */
function inr(n) {
  if (n === null || n === undefined || n === '') return '—';
  const v = Math.round(Number(n) * 100) / 100;
  const dec = Number.isInteger(v) ? 0 : 2;
  return (v < 0 ? '-₹' : '₹') + Math.abs(v).toLocaleString('en-IN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function signCls(n) { return Number(n) < 0 ? 'neg' : 'pos'; }
function shareHead(title) { return '*' + ((S.cfg && S.cfg.setup.businessName) || 'CostingPlus') + '*\n_' + title + '_ · ' + ((S.dash && S.dash.period) || '') + '\n'; }

/* ---------- Detail router ---------- */
async function openDetail(key, detail) {
  const L = (S.dash && S.dash.labels) || S.cfg.labels;
  const titles = { sales: 'Sales', gross: 'Profit by ' + L.job.toLowerCase(), opex: 'Operating expenses', net: 'Profit & loss',
    running: 'Running ' + L.jobs.toLowerCase(), loss: 'Loss ' + L.jobs.toLowerCase(), due: 'Delivery due', completed: 'Completed ' + L.jobs.toLowerCase(),
    labour: 'Labour wages', overhead: 'Overhead per ' + L.unit, quotes: 'Quotes', gst: 'Pending GST bills', myEntries: 'My entries today' };
  const title = titles[key] || 'Details';
  if (key === 'myEntries') return toast('Your entries list comes with the History update.');
  sheetLoading(title);

  if (key === 'due' || (!isOwner() && key === 'running')) {
    const r = await api('listJobs', { status: 'Running', limit: 200 });
    if (!r.ok) return closeSheet();
    let items = r.data.items;
    if (key === 'due') {
      const lim = new Date(); lim.setDate(lim.getDate() + 7);
      items = items.filter(j => j.deliveryDate && new Date(j.deliveryDate) <= lim).sort((a, b) => a.deliveryDate < b.deliveryDate ? -1 : 1);
    }
    return openSheet(title, dueHtml(items, L), items.length ? shareHead(title) + items.map(j => `${j.jobId} · ${j.customer} · ${j.item} · due ${fmtDate(j.deliveryDate)}${j.overdue ? ' (LATE)' : ''}`).join('\n') : '');
  }
  if (detail === 'quotes') {
    const r = await api('listQuotes', Object.assign({ status: 'All' }, periodPayload()));
    if (!r.ok) return closeSheet();
    return openSheet(title, quotesHtml(r.data));
  }
  const r = await api('report', Object.assign({ type: detail }, periodPayload()));
  if (!r.ok) return closeSheet();
  const d = r.data;
  if (detail === 'sales') return openSheet(title, salesHtml(d), shareHead('Sales') + 'Total: ' + inr(d.total) + '\n' + d.items.map(i => `${i.jobId} ${i.customer}: ${inr(i.amount)}`).join('\n'));
  if (detail === 'orders') {
    const filt = { running: x => x.status === 'Running', loss: x => x.loss, completed: x => x.status === 'Closed' }[key] || (() => true);
    const items = d.items.filter(filt);
    return openSheet(title, ordersHtml(items, L, key), shareHead(title) + items.map(o => `${o.jobId} ${o.customer}: cost ${inr(o.costPerUnit)}/${L.unit}, profit ${inr(o.profit)}${o.isEstimate ? ' (est.)' : ''}`).join('\n'));
  }
  if (detail === 'expenses') return openSheet(title, expensesHtml(d, L, key), shareHead(title) + d.operating.map(x => x.name + ': ' + inr(x.amount)).join('\n') + '\nTotal: ' + inr(d.operatingTotal) + (d.overheadPerUnit ? '\nOverhead/' + L.unit + ': ' + inr(d.overheadPerUnit) : ''));
  if (detail === 'pnl') {
    const t = await api('report', { type: 'trend', by: 'month', count: 6 }, { silent: true });
    return openSheet(title, pnlHtml(d, t.ok ? t.data.items : []), shareHead('Profit & Loss') +
      `Sales: ${inr(d.sales)}\nOrder cost: ${inr(d.orderCost)}\nGross profit: ${inr(d.gross)} (${d.grossPct}%)\nOperating expenses: ${inr(d.opex)}\n*Net profit: ${inr(d.net)} (${d.netPct}%)*`);
  }
  if (detail === 'labour') return openSheet(title, labourHtml(d), shareHead(title) + d.byWorker.map(w => `${w.name}: earned ${inr(w.amount)}, pending ${inr(w.payable)}, advance ${inr(w.advanceOutstanding)}`).join('\n'));
  if (detail === 'gstPending') return openSheet(title, gstHtml(d), shareHead(title) + d.items.map(b => `${fmtDate(b.date)} ${b.party || '-'} #${b.billNo || '-'}: ${inr(b.total)}`).join('\n'));
  closeSheet();
}

async function openOrderCost(jobId) {
  const r = await api('report', { type: 'orderCost', jobId });
  if (!r.ok) return;
  const c = r.data, L = c.labels;
  const line = (a, b, cls = '') => `<div class="r ${cls}"><span>${a}</span><span>${b}</span></div>`;
  const html = `
    <div style="margin-bottom:10px"><b style="font-size:17px">${esc(c.customer)}</b> <span class="tag">${esc(c.status)}</span><br>
      <span style="color:var(--muted)">${esc(c.item)} · ${c.qty} ${esc(c.unit || L.unit)}${c.deliveryDate ? ' · due ' + fmtDate(c.deliveryDate) : ''}</span></div>
    <div class="kpis">
      <div class="kpi"><small>Cost / ${esc(L.unit)}</small><b>${inr(c.costPerUnit)}</b></div>
      <div class="kpi"><small>Price / ${esc(L.unit)}</small><b>${inr(c.sellingPrice)}</b></div>
      <div class="kpi"><small>Profit${c.isEstimate ? ' (estimate)' : ''}</small><b class="${signCls(c.profit)}">${inr(c.profit)}</b></div>
      <div class="kpi"><small>Margin</small><b class="${signCls(c.marginPct)}">${c.marginPct === null ? '—' : c.marginPct + '%'}</b></div>
    </div>
    ${c.lossReason ? `<p class="neg" style="margin:0 0 12px"><b>${esc(c.lossReason)}</b></p>` : ''}
    <div class="sec-h">Cost breakdown</div>
    <div class="stmt">
      ${line('<b>Material & expenses</b>', '<b>' + inr(c.material) + '</b>')}
      ${c.materialHeads.map(h => line(esc(h.name), inr(h.amount), 'sub')).join('')}
      ${line('<b>Labour</b>', '<b>' + inr(c.labour) + '</b>')}
      ${c.labourHeads.map(h => line(esc(h.name), inr(h.amount), 'sub')).join('')}
      ${c.overhead ? line('<b>Overhead share</b>', '<b>' + inr(c.overhead) + '</b>') : ''}
      ${line('Total cost', inr(c.totalCost), 'tot last')}
    </div>
    <div class="sec-h">Sales</div>
    <div class="stmt">
      ${line('Dispatched', c.dispatchedQty + ' of ' + c.qty + ' ' + esc(L.unit))}
      ${line('Sales so far', inr(c.sales))}
      ${c.isEstimate ? line('Expected sales (full order)', inr(c.expectedSales)) : ''}
    </div>`;
  const share = shareHead(L.job + ' ' + c.jobId + ' costing') +
    `${c.customer} · ${c.item} · ${c.qty} ${L.unit}\nMaterial: ${inr(c.material)}\nLabour: ${inr(c.labour)}\n${c.overhead ? 'Overhead: ' + inr(c.overhead) + '\n' : ''}Total cost: ${inr(c.totalCost)}\n*Cost/${L.unit}: ${inr(c.costPerUnit)}* · Price: ${inr(c.sellingPrice)}\nProfit: ${inr(c.profit)}${c.isEstimate ? ' (estimate)' : ''}`;
  openSheet(L.job + ' ' + c.jobId, html, share, true);
}

/* ---------- Detail HTML builders ---------- */
function emptyMsg(t) { return `<div class="empty"><p>${esc(t)}</p></div>`; }

function salesHtml(d) {
  if (!d.items.length) return emptyMsg('No dispatch in this period yet.');
  return `<div class="kpis"><div class="kpi"><small>Total sales</small><b>${inr(d.total)}</b></div>
      <div class="kpi"><small>${esc(d.labels.jobs)}</small><b>${d.items.length}</b></div></div>
    <div class="sec-h">By ${esc(d.labels.job.toLowerCase())}</div>
    <div class="rows">${d.items.map(i => `<button class="row" data-job="${esc(i.jobId)}"><span class="l"><b>${esc(i.jobId)} · ${esc(i.customer)}</b><small>${esc(i.item)} · ${i.qty} ${esc(d.labels.unit)}</small></span><span class="rt"><b>${inr(i.amount)}</b></span></button>`).join('')}</div>
    ${d.byCustomer.length > 1 ? `<div class="sec-h">By customer</div>${barsHtml(d.byCustomer)}` : ''}`;
}

function ordersHtml(items, L, key) {
  if (!items.length) return emptyMsg(key === 'loss' ? 'No loss-making ' + L.jobs.toLowerCase() + '. Good going!' : 'Nothing to show for this period.');
  return `<p style="color:var(--muted);margin:0 0 10px;font-size:14px">Tap any ${esc(L.job.toLowerCase())} for full costing. "Estimate" = running, based on expected sales.</p>
    <div class="rows">${items.map(o => `<button class="row" data-job="${esc(o.jobId)}">
      <span class="l"><b>${esc(o.jobId)} · ${esc(o.customer)}${o.isEstimate ? '<span class="tag">Estimate</span>' : ''}${o.loss ? '<span class="tag red">Loss</span>' : ''}</b>
        <small>${esc(o.item)} · cost ${inr(o.costPerUnit)} / price ${inr(o.sellingPrice)}</small>
        ${o.lossReason ? `<small class="neg" style="display:block">${esc(o.lossReason)}</small>` : ''}</span>
      <span class="rt"><b class="${signCls(o.profit)}">${inr(o.profit)}</b><small>${o.marginPct === null ? '' : o.marginPct + '%'}</small></span></button>`).join('')}</div>`;
}

function barsHtml(list) {
  const max = Math.max(...list.map(x => Math.abs(x.amount)), 1);
  return `<div class="bars">${list.map(x => `<div class="bar"><div class="top"><span>${esc(x.name)}</span><b>${inr(x.amount)}</b></div>
    <div class="track"><div class="fill" style="width:${Math.max(2, Math.abs(x.amount) * 100 / max)}%"></div></div></div>`).join('')}</div>`;
}

function chartHtml(items, field) {
  if (!items || !items.length) return '';
  const max = Math.max(...items.map(t => Math.abs(t[field])), 1);
  return `<div class="bars"><div class="chart">${items.map(t => `<div class="c" title="${esc(t.label)}: ${inr(t[field])}">
    <i class="${t[field] < 0 ? 'neg' : ''}" style="height:${Math.abs(t[field]) * 100 / max}%"></i><span>${esc(t.label)}</span></div>`).join('')}</div></div>`;
}

function expensesHtml(d, L, key) {
  return `<div class="kpis"><div class="kpi"><small>Operating total</small><b>${inr(d.operatingTotal)}</b></div>
      <div class="kpi"><small>Overhead / ${esc(L.unit)}</small><b>${d.overheadPerUnit === null ? '—' : inr(d.overheadPerUnit)}</b></div></div>
    ${key === 'overhead' ? `<p style="color:var(--muted);font-size:14px;margin:0 0 12px">Overhead per ${esc(L.unit)} = operating expenses ÷ ${esc(L.unit)} dispatched in this period.</p>` : ''}
    <div class="sec-h">Operating expenses</div>
    ${d.operating.length ? barsHtml(d.operating) : emptyMsg('No general expenses in this period.')}
    <div class="sec-h">Weekly trend</div>${chartHtml(d.trend, 'opex')}
    ${d.orderMaterial.length ? `<div class="sec-h">${esc(L.job)} material & expenses</div>${barsHtml(d.orderMaterial)}` : ''}`;
}

function pnlHtml(d, trend) {
  const line = (a, b, cls = '') => `<div class="r ${cls}"><span>${a}</span><span>${b}</span></div>`;
  return `<div class="stmt">
      ${line('Sales', inr(d.sales))}
      ${line('Material & expenses', '− ' + inr(d.orderMaterial), 'sub')}
      ${line('Labour', '− ' + inr(d.orderLabour), 'sub')}
      ${line('Gross profit <small>(' + d.grossPct + '%)</small>', `<span class="${signCls(d.gross)}">${inr(d.gross)}</span>`, 'tot')}
      ${d.opexBreakdown.map(x => line(esc(x.name), '− ' + inr(x.amount), 'sub')).join('')}
      ${line('Operating expenses', '− ' + inr(d.opex))}
      ${line('Net profit <small>(' + d.netPct + '%)</small>', `<span class="${signCls(d.net)}">${inr(d.net)}</span>`, 'tot last')}
    </div>
    ${d.overheadPerUnit !== null ? `<p style="color:var(--muted);font-size:14px">${d.dispatchedQty} ${esc(d.labels.unit)} dispatched · overhead ${inr(d.overheadPerUnit)} per ${esc(d.labels.unit)}</p>` : ''}
    <p style="color:var(--muted);font-size:13.5px">${d.gstRegistered ? 'GST on purchases is not counted as cost (claimable).' : 'GST on purchases is counted as cost (no GST number in setup).'}</p>
    ${trend.length ? `<div class="sec-h">Net profit · last 6 months</div>${chartHtml(trend, 'net')}` : ''}`;
}

function labourHtml(d) {
  return `<div class="kpis"><div class="kpi"><small>Total wages earned</small><b>${inr(d.total)}</b></div>
      <div class="kpi"><small>For ${esc(d.labels.jobs.toLowerCase())} / general</small><b style="font-size:15px">${inr(d.orderLabour)} / ${inr(d.generalLabour)}</b></div></div>
    <div class="sec-h">By worker</div>
    ${d.byWorker.length ? `<div class="rows">${d.byWorker.map(w => `<div class="row"><span class="l"><b>${esc(w.name)}</b>
      <small>Pending ${inr(w.payable)} · Advance ${inr(w.advanceOutstanding)}</small></span><span class="rt"><b>${inr(w.amount)}</b><small>earned</small></span></div>`).join('')}</div>` : emptyMsg('No wage entries in this period.')}
    ${d.byProcess.length ? `<div class="sec-h">By process</div>${barsHtml(d.byProcess)}` : ''}`;
}

function quotesHtml(d) {
  return `<div class="kpis"><div class="kpi"><small>Sent</small><b>${d.total}</b></div><div class="kpi"><small>Won</small><b class="pos">${d.won}</b></div>
      <div class="kpi"><small>Pending</small><b>${d.pending}</b></div><div class="kpi"><small>Win rate</small><b>${d.winRatePct === null ? '—' : d.winRatePct + '%'}</b></div></div>
    ${d.items.length ? `<div class="rows">${d.items.map(q => `<div class="row"><span class="l"><b>${esc(q.quoteId)} · ${esc(q.customer)}
      <span class="tag ${q.status === 'Lost' || q.expired ? 'red' : ''}">${q.expired ? 'Expired' : esc(q.status)}</span></b>
      <small>${esc(q.item)} · ${q.qty} @ ${inr(q.quotePrice)} · margin ${q.marginPct}%</small></span><span class="rt"><b>${inr(q.totalValue)}</b></span></div>`).join('')}</div>` : emptyMsg('No quotes in this period.')}`;
}

function gstHtml(d) {
  if (!d.items.length) return emptyMsg('All GST bills received.');
  return `<div class="kpis"><div class="kpi"><small>Bills pending</small><b>${d.count}</b></div><div class="kpi"><small>Bill value</small><b>${inr(d.total)}</b></div></div>
    <div class="sec-h">By supplier</div>${barsHtml(d.byParty)}
    <div class="sec-h">Bills</div>
    <div class="rows">${d.items.map(b => `<div class="row"><span class="l"><b>${esc(b.party || 'No supplier')}</b><small>${fmtDate(b.date)} · bill ${esc(b.billNo || '-')} · GST ${inr(b.gst)}</small></span><span class="rt"><b>${inr(b.total)}</b></span></div>`).join('')}</div>`;
}

function dueHtml(items, L) {
  if (!items.length) return emptyMsg('No deliveries due in the next 7 days.');
  return `<div class="rows">${items.map(j => `<div class="row"><span class="l"><b>${esc(j.jobId)} · ${esc(j.customer)}</b>
    <small>${esc(j.item)} · ${j.qty} ${esc(j.unit || L.unit)}</small></span>
    <span class="rt"><b class="${j.overdue ? 'neg' : ''}">${fmtDate(j.deliveryDate)}</b><small>${j.overdue ? 'Late' : 'Due'}</small></span></div>`).join('')}</div>`;
}

function planStrip(left) {
  if (left === null || left > 7) return '';
  const msg = left < 0 ? 'Your plan has ended.' : left === 0 ? 'Your plan ends today.' : `Your plan ends in ${left} day${left > 1 ? 's' : ''}.`;
  return `<div class="plan-strip warn">${ICON.wallet}<div><b>${msg}</b><br><small>Renew to keep adding entries. Your data is safe.</small></div></div>`;
}

/* ============================================================
   ENTRY (forms arrive in Part 3)
   ============================================================ */
function renderEntry() {
  const L = S.cfg.labels;
  const allowed = String(S.user.allowedForms || 'ALL');
  const can = k => allowed === 'ALL' || allowed.split(',').map(s => s.trim()).indexOf(k) !== -1;
  const tiles = [
    ['Expense', 't-expense', ICON.bill, 'Expense', 'Bills, split bills, general'],
    ['Labour', 't-wages', ICON.people, 'Wages', 'Piece, daily, sampling'],
    ['Advance', 't-advance', ICON.wallet, 'Advance', 'Cash to worker'],
    ['Production', 't-prod', ICON.box, 'Production', 'Output & dispatch'],
    ['Order', 't-order', ICON.order, 'New ' + L.job.toLowerCase(), 'Customer, qty, price'],
    ['Quote', 't-quote', ICON.quote, 'Quote', 'Cost → price']
  ].filter(t => (t[0] !== 'Quote' || isOwner()) && can(t[0] === 'Advance' ? 'Labour' : t[0]));
  view.innerHTML = `
    <h1>New entry</h1>
    <p class="lead">What do you want to add?</p>
    <div class="tiles">${tiles.map(t => `<button class="tile ${t[1]}" data-form="${t[0]}">${t[2]}<div><b>${t[3]}</b><small>${t[4]}</small></div></button>`).join('')}</div>`;
  view.querySelector('.tiles').onclick = e => { const b = e.target.closest('[data-form]'); if (b) toast(b.querySelector('b').textContent + ' form comes in the next update.'); };
}

function renderHistory() {
  view.innerHTML = `<h1>History</h1><div class="empty">${ICON.history}<p>Your saved entries will show here, with edit and cancel.</p></div>`;
}
function renderReports() {
  view.innerHTML = `<h1>Reports</h1><div class="empty">${ICON.reports}<p>Weekly and monthly profit, expenses, order costing and wages will show here.</p></div>`;
}

/* ============================================================
   SETTINGS
   ============================================================ */
function renderSettings() {
  const b = S.business || {};
  const left = daysLeft(b.expiry);
  view.innerHTML = `
    <h1>${isOwner() ? 'Settings' : 'More'}</h1>
    ${isOwner() ? `<div class="plan-strip ${left !== null && left <= 7 ? 'warn' : ''}">${ICON.wallet}
      <div><b>${esc(b.plan || 'Trial')} plan</b><br><small>Valid till ${esc(b.expiry || '-')}${left !== null && left >= 0 ? ' · ' + left + ' days left' : ''}</small></div></div>` : ''}
    <div class="list">
      ${isOwner() ? `<button data-act="setup"><span class="ic">${ICON.building}</span><span class="tx"><b>Business setup</b>
        <small>${esc(S.cfg.setup.industry)} · ${esc(S.cfg.labels.unit)} · week starts ${S.cfg.setup.weekStart === 'Sun' ? 'Sunday' : 'Monday'}</small></span><span class="chev">›</span></button>` : ''}
      ${isOwner() ? `<button data-act="masters"><span class="ic">${ICON.people}</span><span class="tx"><b>Parties, categories, processes</b>
        <small>Customers, suppliers, workers</small></span><span class="chev">›</span></button>` : ''}
      <button data-act="help"><span class="ic">${ICON.play}</span><span class="tx"><b>Help videos</b><small>Tamil and English</small></span><span class="chev">›</span></button>
      ${SUPPORT_WHATSAPP ? `<a href="https://wa.me/${SUPPORT_WHATSAPP}" target="_blank" rel="noopener"><span class="ic">${ICON.chat}</span><span class="tx"><b>WhatsApp support</b><small>When videos don't answer it</small></span><span class="chev">›</span></a>` : ''}
      <button data-act="logout"><span class="ic" style="color:var(--rule)">${ICON.logout}</span><span class="tx"><b>Log out</b><small>${esc(S.user.name)}</small></span></button>
    </div>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:20px">CostingPlus ${APP_VERSION}</p>`;
  view.querySelector('.list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'setup') go('setup');
    if (a === 'logout') { if (confirm('Log out of CostingPlus?')) logout(); }
    if (a === 'masters') toast('Masters screen comes in a later update.');
    if (a === 'help') toast('Help videos will be added soon.');
  };
}

/* ============================================================
   START
   ============================================================ */
(async function start() {
  S.token = store.get('token'); S.user = store.get('user'); S.business = store.get('business'); S.cfg = store.get('cfg');
  if (!S.token) return renderLogin();
  buildTabbar();
  if (S.cfg) render();               // show cached screen instantly
  const r = await api('getConfig', {}, { silent: !!S.cfg });   // then refresh in background
  if (r.ok) { S.cfg = r.data; store.set('cfg', S.cfg); render(); }
})();
</script>
